name: Python 3 bootstrap

on:
  push:
    branches:
      - python3-modernization
    paths:
      - .github/workflows/python3-bootstrap.yml

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout modernization branch
        uses: actions/checkout@v4
        with:
          ref: python3-modernization

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Mechanically port Python 2 syntax
        shell: bash
        run: |
          python -m lib2to3 -w -n DatabasePort.py Start.py Timeline logs
          find . -name '*.bak' -delete

      - name: Remove bundled Python 2 MySQL wheels
        shell: bash
        run: |
          rm -f MySQL_python-1.2.5-cp27-none-win32.whl
          rm -f MySQL_python-1.2.5-cp27-none-win_amd64.whl

      - name: Compile-check converted source
        shell: bash
        run: python -m compileall -q DatabasePort.py Start.py Timeline logs

      - name: Commit converted source
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No conversion changes detected.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: mechanically port Timeline to Python 3'
          git push origin HEAD:python3-modernization
