services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MYSQL_DATABASE:-timeline}
      MARIADB_USER: ${MYSQL_USER:-timeline}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:-timeline}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-timeline-root}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./timeline.sql:/docker-entrypoint-initdb.d/001-timeline.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mariadb_data:
  redis_data:
