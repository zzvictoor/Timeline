services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MYSQL_DATABASE:-timeline}
      MARIADB_USER: ${MYSQL_USER:-timeline}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:-timeline}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-timeline-root}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./timeline.sql:/docker-entrypoint-initdb.d/001-timeline.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  timeline:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TIMELINE_BIND_HOST: 0.0.0.0
      TIMELINE_LOGIN_PORT: ${TIMELINE_LOGIN_PORT:-6112}
      TIMELINE_WORLD_PORT: ${TIMELINE_WORLD_PORT:-9875}
      TIMELINE_WORLD_NAME: ${TIMELINE_WORLD_NAME:-Gravity}
      TIMELINE_WORLD_ID: ${TIMELINE_WORLD_ID:-100}
      TIMELINE_WORLD_MAX: ${TIMELINE_WORLD_MAX:-300}
      TIMELINE_HOT_RELOAD: "0"
      TIMELINE_LEGACY_IMPORT_COMPAT: "1"
      MYSQL_HOST: mariadb
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-timeline}
      MYSQL_USER: ${MYSQL_USER:-timeline}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-timeline}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      PERSPECTIVE_API_KEY: ${PERSPECTIVE_API_KEY:-}
      FIREBASE_CREDENTIAL_PATH: ${FIREBASE_CREDENTIAL_PATH:-}
    ports:
      - "${TIMELINE_LOGIN_PORT:-6112}:${TIMELINE_LOGIN_PORT:-6112}"
      - "${TIMELINE_WORLD_PORT:-9875}:${TIMELINE_WORLD_PORT:-9875}"

volumes:
  mariadb_data:
  redis_data:
